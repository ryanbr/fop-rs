name: Manual Publish
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Build and upload artifacts only: no version bump, tag, release or publish'
        default: false
        type: boolean
jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          # x86_64 Windows moved to the Windows runner, so its mingw
          # cross-toolchain and target are no longer needed here.
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-multilib
          rustup target add i686-pc-windows-gnu
          rustup target add i686-unknown-linux-gnu
        
      - name: Install zigbuild for ARM builds
        run: |
          sudo snap install zig --classic --beta
          cargo install cargo-zigbuild

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
                   
      - name: Bump version and sync install.js
        id: version
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # The downstream jobs name their binaries from this output, so it
            # still has to be set -- just from the version already committed.
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
            echo "Dry run: building the current version, nothing will be bumped or published."
            exit 0
          fi
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/const VERSION = '.*'/const VERSION = '$NEW_VERSION'/" install.js
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo check  # Updates Cargo.lock
          git add package.json install.js Cargo.toml Cargo.lock
          git commit -m "v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          
      - name: Install llvm-tools for PGO
        run: rustup component add llvm-tools-preview

      - name: Generate PGO profile data
        run: |
          # Train on a real sort. `cargo test` was doing nothing here: without
          # RUSTFLAGS it rebuilds uninstrumented, so the only profiles were
          # from build scripts, and the shipped v3 binary saw -3.7% where a
          # sorting workload gives -9.7%.
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
          cp -r test-lists /tmp/pgo-train
          ./target/release/fop --no-commit /tmp/pgo-train
          rm -rf /tmp/pgo-train
          $(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
          cargo clean

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Baseline - works on all x86_64. PGO reorders and inlines; it adds
          # no instructions, so this still runs anywhere an unoptimised build
          # would. This is the binary install.js fetches, so it is the one
          # worth optimising.
          RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata" cargo build --release
          cp target/release/fop "fop-${VERSION}-linux-x86_64"

          # Optimized for ~2015+ CPUs (AVX2) + PGO
          cargo clean
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=/tmp/pgo-data/merged.profdata" cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/fop "fop-${VERSION}-linux-x86_64-v3"


          # Linux x86 32-bit
          cargo clean
          cargo build --release --target i686-unknown-linux-gnu
          cp target/i686-unknown-linux-gnu/release/fop "fop-${VERSION}-linux-x86_32"

          # Windows x86_64 is built on the Windows runner instead, where it is
          # native and so can carry a PGO profile.

          # Windows x86 32-bit
          cargo clean
          cargo build --release --target i686-pc-windows-gnu
          cp target/i686-pc-windows-gnu/release/fop.exe "fop-${VERSION}-windows-x86_32.exe"


          # Linux ARM64 baseline (Raspberry Pi 3/4/5, Orange Pi, all ARM64)
          cargo clean
          rustup target add aarch64-unknown-linux-gnu
          cargo zigbuild --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/fop "fop-${VERSION}-linux-arm64"

          # Linux ARM64 optimized (Neoverse N1+: Graviton2+, Ampere, Pi 5, Orange Pi 5)
          cargo clean
          RUSTFLAGS="-C target-cpu=neoverse-n1" cargo zigbuild --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/fop "fop-${VERSION}-linux-arm64-n1"

          # Linux RISC-V 64-bit
          cargo clean
          rustup target add riscv64gc-unknown-linux-gnu
          cargo zigbuild --release --target riscv64gc-unknown-linux-gnu
          cp target/riscv64gc-unknown-linux-gnu/release/fop "fop-${VERSION}-linux-riscv64"

      - name: Upload Linux/Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-windows-binaries
          path: |
            fop-*-linux-*
            fop-*-windows-x86_32.exe

      - name: Push changes
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags

  build-windows:
    runs-on: windows-latest
    needs: build-linux-windows
    steps:
      - uses: actions/checkout@v5
      
      - name: Pull latest changes
        run: git pull origin main --tags

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      # -Cprofile-generate needs the profiler_builtins crate, which rustup
      # ships only for a toolchain's own host -- instrumenting windows-gnu as
      # a *target* of the msvc host fails with E0463. Installing the gnu
      # toolchain makes it the host, so the instrumented build, the training
      # run and the final binaries are all native, and the published binary
      # stays the same mingw build users already have. This toolchain brings
      # its own mingw, so no MSYS2 wrangling either.
      - name: Install the windows-gnu toolchain for PGO
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup component add llvm-tools-preview --toolchain stable-x86_64-pc-windows-gnu

      - name: Generate PGO profile data
        run: |
          # Native on this runner, so the instrumented binary can be run to
          # collect a real profile -- which it cannot be when cross-compiled
          # from Linux, where these used to be built.
          $env:RUSTFLAGS = "-Cprofile-generate=$env:RUNNER_TEMP\pgo-data"
          cargo +stable-x86_64-pc-windows-gnu build --release
          Copy-Item -Recurse test-lists "$env:RUNNER_TEMP\pgo-train"
          # A leading .\ is required: PowerShell's call operator reads a bare
          # relative path as a command name, not a file.
          & ".\target\release\fop.exe" --no-commit "$env:RUNNER_TEMP\pgo-train"
          if ($LASTEXITCODE -ne 0) { throw "PGO training run failed ($LASTEXITCODE)" }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\pgo-train"
          $env:RUSTFLAGS = ""
          # llvm-profdata is a host tool, so take the gnu toolchain's own.
          $sysroot = rustc +stable-x86_64-pc-windows-gnu --print sysroot
          $profdata = (Get-ChildItem "$sysroot\lib\rustlib\*\bin\llvm-profdata.exe" | Select-Object -First 1).FullName
          if (-not $profdata) { throw "llvm-profdata not found under $sysroot" }
          & $profdata merge -o "$env:RUNNER_TEMP\pgo-data\merged.profdata" "$env:RUNNER_TEMP\pgo-data"
          if (-not (Test-Path "$env:RUNNER_TEMP\pgo-data\merged.profdata")) { throw "no PGO profile was produced" }
          cargo clean

      - name: Build Windows binaries
        run: |
          $VERSION = "${{ needs.build-linux-windows.outputs.version }}"
          $pgo = "$env:RUNNER_TEMP\pgo-data\merged.profdata"

          # Windows x86_64 baseline + PGO, built by the gnu toolchain as its
          # own host. Runs on every x86_64: PGO reorders and inlines, it adds
          # no instructions.
          $env:RUSTFLAGS = "-Cprofile-use=$pgo"
          cargo +stable-x86_64-pc-windows-gnu build --release
          Copy-Item ".\target\release\fop.exe" "fop-${VERSION}-windows-x86_64.exe"

          # Windows x86_64-v3 (AVX2) + PGO
          cargo clean
          $env:RUSTFLAGS = "-C target-cpu=x86-64-v3 -Cprofile-use=$pgo"
          cargo +stable-x86_64-pc-windows-gnu build --release
          Copy-Item ".\target\release\fop.exe" "fop-${VERSION}-windows-x86_64-v3.exe"

          # Windows ARM64, cross-compiled from this x64 runner, so no PGO.
          # Optimized for Snapdragon 8cx Gen 3+ / Cortex-A78+, static CRT to avoid VCRUNTIME140.dll
          cargo clean
          $env:RUSTFLAGS = ""
          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-cpu=cortex-a78 -C target-feature=+crt-static"
          cargo build --release --target aarch64-pc-windows-msvc
          Copy-Item ".\target\aarch64-pc-windows-msvc\release\fop.exe" "fop-${VERSION}-windows-arm64-v2.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-binaries
          path: fop-*-windows-*.exe
         
  build-macos:
    runs-on: macos-latest
    needs: build-linux-windows
    steps:
      - uses: actions/checkout@v5
      
      - name: Pull latest changes
        run: git pull origin main --tags

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install llvm-tools for PGO
        run: rustup component add llvm-tools-preview

      - name: Generate PGO profile data
        run: |
          # Train on a real sort, as the Linux job does: `cargo test` without
          # RUSTFLAGS rebuilds uninstrumented and contributes no profile at
          # all, leaving only build-script data behind.
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
          cp -r test-lists /tmp/pgo-train
          ./target/release/fop --no-commit /tmp/pgo-train
          rm -rf /tmp/pgo-train
          $(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
          cargo clean

      - name: Build macOS binaries
        run: |
          VERSION=${{ needs.build-linux-windows.outputs.version }}

          # macOS x86_64 (Intel) - no PGO (cross-compiled from ARM runner)
          cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/fop "fop-${VERSION}-macos-x86_64"

          # macOS ARM64 (Apple Silicon - optimized for M1+) + PGO
          cargo clean
          RUSTFLAGS="-C target-cpu=apple-m1 -Cprofile-use=/tmp/pgo-data/merged.profdata" cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/fop "fop-${VERSION}-macos-arm64"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-binaries
          path: fop-*-macos-*

  release:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
    
      - name: Pull latest changes
        run: |
          git pull origin main --tags

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-linux-windows.outputs.version }}
          files: |
            linux-windows-binaries/*
            macos-binaries/*
            windows-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
