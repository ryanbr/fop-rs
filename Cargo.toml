[package]
name = "fop"
version = "6.0.0"
edition = "2021"
authors = ["Original: Michael (EasyList)", "Rust port"]
description = "Filter Orderer and Preener - A tool for sorting and cleaning ad-blocking filter lists"
license = "GPL-3.0"
repository = "https://github.com/easylist/easylist"
keywords = ["adblock", "easylist", "filter", "privacy"]
categories = ["command-line-utilities"]

[dependencies]
regex = "1.12"
walkdir = "2.5"
rustyline = "17"
rayon = "1.11"
ahash = "0.8"
base64 = "0.22"
md5 = "0.8"
owo-colors = "4"
similar = "2"
urlencoding ="2.1"
mimalloc = { version = "0.1", default-features = false }

# Only to turn on ANSI escape processing for the console; see
# enable_ansi_on_windows in main.rs. Already in the Windows dependency graph,
# so this adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
